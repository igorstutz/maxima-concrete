name: Deploy preview to GitHub Pages

# Deploy automático DESLIGADO em 2026-08-18: a homologação na VPS
# (maximaconcrete.igorstutz.online) assumiu o papel de preview e, diferente do
# Pages, roda PHP — ou seja, tem o painel funcionando. O Pages virava só mais um
# build a cada push. Continua disponível sob demanda: Actions → este workflow →
# "Run workflow" (ou `gh workflow run deploy-pages.yml --ref main`); enquanto
# ninguém rodar, o site do Pages fica parado na última versão publicada.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v4 tinha como alvo o Node 20 e passou a ser forçada a rodar no Node 24
      # pelos runners; o deployment era criado e cancelado em seguida.
      - id: deployment
        uses: actions/deploy-pages@v5
