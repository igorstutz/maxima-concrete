name: Deploy to VPS (homologação)

# Publica o mesmo build da produção em maximaconcrete.igorstutz.online
# (VPS Hostinger, container Apache+PHP exposto por Cloudflare Tunnel).
# É lá que o painel do CMS é usado antes de o domínio real entrar no ar:
# o GitHub Pages não executa PHP, então o login OAuth não funciona por lá.

on:
  push:
    branches: [main]
    # Ver nota em copy-section.yml: o pedido de cópia sozinho não gera deploy.
    paths-ignore:
      - "src/content/settings/copy-section.json"
      - "src/content/settings/optimize-images.json"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export (root-domain build, no basePath)
        run: npm run build

      # O config.yml versionado aponta para produção; na homologação o
      # base_url precisa ser o host de lá, senão o GitHub recusa o
      # redirect_uri do OAuth.
      - name: Point CMS panel to the staging host
        run: node _extraction/set-cms-host.mjs https://maximaconcrete.igorstutz.online

      # Documentos internos (plano de virada) e o endpoint que guarda o estado
      # compartilhado do checklist. Entram só aqui e no preview do GitHub Pages —
      # docs/ fica FORA de public/, então o deploy de produção não os leva.
      - name: Anexar documentos internos
        run: |
          if [ -d docs ]; then
            cp -r docs/. out/
            ls -la out/golive/ 2>/dev/null || true
          fi

      # EXCLUDE: /.private/ não é enviado NEM apagado — é onde vivem o
      # oauth-config.php e o submissions.log do servidor.
      #
      # Três tentativas, como no deploy da Hostinger: em dia de edição intensa o
      # painel dispara dezenas de deploys e o SSH começa a recusar conexão
      # ("connect to host port 22: Connection timed out"). Sem as tentativas
      # extras este workflow falhava 3x mais que o da Hostinger, que já as tinha.
      - name: Deploy to VPS (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_SSH_HOST }}
          REMOTE_USER: ${{ secrets.VPS_SSH_USER }}
          REMOTE_PORT: "22"
          SOURCE: "out/"
          TARGET: "/opt/maximaconcrete/site/"
          ARGS: "-rltzv --delete"
          EXCLUDE: "/.private/, .git*, node_modules/"

      - name: Wait before retry 1
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to VPS (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_SSH_HOST }}
          REMOTE_USER: ${{ secrets.VPS_SSH_USER }}
          REMOTE_PORT: "22"
          SOURCE: "out/"
          TARGET: "/opt/maximaconcrete/site/"
          ARGS: "-rltzv --delete"
          EXCLUDE: "/.private/, .git*, node_modules/"

      - name: Wait before retry 2
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to VPS (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_SSH_HOST }}
          REMOTE_USER: ${{ secrets.VPS_SSH_USER }}
          REMOTE_PORT: "22"
          SOURCE: "out/"
          TARGET: "/opt/maximaconcrete/site/"
          ARGS: "-rltzv --delete"
          EXCLUDE: "/.private/, .git*, node_modules/"

      - name: Fail if all deploy attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: |
          echo "As 3 tentativas de deploy falharam (SSH da VPS recusando conexão)."
          exit 1
